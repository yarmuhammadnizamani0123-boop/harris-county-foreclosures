name: Harris County Daily Foreclosure Automation

on:
  schedule:
    # 11:00 UTC = 6:00 AM Central Time (Houston, TX)
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime

jobs:
  run-daily-tracker:
    runs-on: ubuntu-latest # Runs in US Datacenter (bypasses all geo-blocks)

    permissions:
      contents: write # Needed to commit new reports & state database back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Execute Harris County Foreclosure Scraper
        run: |
          python scraper.py

      - name: Commit and Save Reports & Database to Repository
        run: |
          git config --global user.name "HarrisCountyBot"
          git config --global user.email "bot@harriscountytracker.local"
          git add reports/ database/
          git commit -m "Daily Update: $(date +'%Y-%m-%d') [Harris County Foreclosures]" || echo "No changes to commit"
          git push
